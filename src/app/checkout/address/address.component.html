<div class="checkout-step">

  <div class="step-header">
    <h2>
      <span class="material-icons">location_on</span>
      Shipping Address
    </h2>
    <button
      class="btn btn-ghost btn-sm"
      (click)="canEdit = !canEdit"
    >
      <span class="material-icons">{{ canEdit ? 'lock_open' : 'edit' }}</span>
      {{ canEdit ? 'Editing' : 'Edit Address' }}
    </button>
  </div>

  <form [formGroup]="address" class="address-form">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="firstName"
          placeholder="John"
          [readonly]="!canEdit"
          [class.readonly]="!canEdit"
        />
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="lastName"
          placeholder="Doe"
          [readonly]="!canEdit"
          [class.readonly]="!canEdit"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Street Address</label>
      <input
        type="text"
        class="form-control"
        formControlName="street"
        placeholder="123 Main Street"
        [readonly]="!canEdit"
        [class.readonly]="!canEdit"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">City</label>
        <input
          type="text"
          class="form-control"
          formControlName="city"
          placeholder="New York"
          [readonly]="!canEdit"
          [class.readonly]="!canEdit"
        />
      </div>
      <div class="form-group">
        <label class="form-label">State</label>
        <input
          type="text"
          class="form-control"
          formControlName="state"
          placeholder="NY"
          [readonly]="!canEdit"
          [class.readonly]="!canEdit"
        />
      </div>
      <div class="form-group">
        <label class="form-label">Zip Code</label>
        <input
          type="text"
          class="form-control"
          formControlName="zipCode"
          placeholder="10001"
          [readonly]="!canEdit"
          [class.readonly]="!canEdit"
        />
      </div>
    </div>

    <div class="step-footer">
      <button
        type="button"
        class="btn btn-outline"
        [disabled]="!canEdit || address.invalid"
        (click)="UpdateAddress()"
      >
        <span class="material-icons">save</span>
        Save Address
      </button>
      <button
        type="button"
        class="btn btn-primary"
        matStepperNext
        [disabled]="address.invalid"
      >
        Continue
        <span class="material-icons">arrow_forward</span>
      </button>
    </div>
  </form>

</div>
