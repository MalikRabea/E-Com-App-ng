<div class="admin-shell" [class.collapsed]="!sidebarOpen">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <span class="material-icons">bolt</span>
      </div>
      <span class="brand-text" *ngIf="sidebarOpen">E-<strong>Shop</strong> Admin</span>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active"
         class="nav-item"
         [title]="item.label">
        <span class="material-icons nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a routerLink="/" class="nav-item back-link" title="Back to Shop">
        <span class="material-icons nav-icon">store</span>
        <span class="nav-label" *ngIf="sidebarOpen">Back to Shop</span>
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="toggle-btn" (click)="toggleSidebar()">
        <span class="material-icons">{{ sidebarOpen ? 'menu_open' : 'menu' }}</span>
      </button>
      <span class="topbar-title">Admin Panel</span>
    </header>

    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
