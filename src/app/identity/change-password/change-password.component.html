<div class="auth-page page-enter">
  <div class="auth-card">
    <div class="auth-header">
      <span class="material-icons auth-icon">lock_reset</span>
      <h1>Change Password</h1>
      <p>Enter your current password and choose a new one</p>
    </div>

    @if (success) {
      <div class="success-box">
        <span class="material-icons">check_circle</span>
        Password changed! Redirecting...
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success">

      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input
          type="password"
          class="form-input"
          formControlName="currentPassword"
          placeholder="Enter current password"
        />
        <span class="field-error" *ngIf="currentPassword?.touched && currentPassword?.hasError('required')">
          Current password is required
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <input
          type="password"
          class="form-input"
          formControlName="newPassword"
          placeholder="Min 8 chars, 1 number, 1 special char"
        />
        <span class="field-error" *ngIf="newPassword?.touched && newPassword?.hasError('required')">
          New password is required
        </span>
        <span class="field-error" *ngIf="newPassword?.touched && newPassword?.hasError('pattern')">
          Min 8 characters, include a number and special character
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input
          type="password"
          class="form-input"
          formControlName="confirmPassword"
          placeholder="Repeat new password"
        />
        <span class="field-error" *ngIf="confirmPassword?.touched && confirmPassword?.hasError('mismatch')">
          Passwords do not match
        </span>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-full"
        [disabled]="form.invalid || loading"
      >
        <span class="material-icons" *ngIf="!loading">lock</span>
        <span *ngIf="loading" class="spinner-sm"></span>
        {{ loading ? 'Changing...' : 'Change Password' }}
      </button>

    </form>

    <div class="auth-footer">
      <a routerLink="/">Back to Home</a>
    </div>
  </div>
</div>
