<div class="order-summary-block">
  <div class="summary-title">
    <span class="material-icons">receipt_long</span>
    Order Summary
  </div>

  @if (basketTotals) {
    <div class="summary-lines">
      <div class="summary-line">
        <span class="line-label">Subtotal</span>
        <span class="line-value">{{ basketTotals.subtotal | currency }}</span>
      </div>
      <div class="summary-line">
        <span class="line-label">Shipping</span>
        <span class="line-value" *ngIf="basketTotals.shipping > 0">{{ basketTotals.shipping | currency }}</span>
        <span class="line-value free" *ngIf="basketTotals.shipping === 0">Free</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-line total-line">
        <span class="line-label">Total</span>
        <span class="line-value total-value">{{ basketTotals.total | currency }}</span>
      </div>
    </div>
    <p class="summary-note">
      <span class="material-icons" style="font-size:13px">info</span>
      Shipping calculated at checkout
    </p>
  }

  @if (!basketTotals) {
    <div style="padding:20px 16px">
      <div class="skeleton" style="height:14px;border-radius:6px;margin-bottom:10px"></div>
      <div class="skeleton" style="height:14px;border-radius:6px;width:70%;margin-bottom:10px"></div>
      <div class="skeleton" style="height:18px;border-radius:6px;width:50%"></div>
    </div>
  }
</div>
